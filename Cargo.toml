[package]
name = "xbible_engine"
version = "0.1.0"
edition = "2024"
description = "Offline-first Bible engine with UniFFI bindings for Swift, Kotlin and other languages"
license = "GPL-3.0-only"
repository = "https://github.com/Edcorp844/xbible_engine"
readme = "README.md"
keywords = ["bible", "uniffi", "sqlite", "offline", "ffi"]

[dependencies]
directories = "5.0"
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zip = "8.6.0"
thiserror = "2.0.18"
chacha20poly1305 = "0.10.1"
image = { version = "0.25.10", default-features = false, features = [
    "png",
    "jpeg",
] }
reqwest = { version = "0.13.4", features = ["json", "stream", "blocking"] }
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "fs"] }
bytes = "1.11.1"
log = { version = "0.4.33", features = ["release_max_level_info"] }
walkdir = "2.5.0"
webpki-roots = "1.0.11"
rustls = "0.23.46"
rusqlite = { version = "0.40.0", features = ["bundled"] }
rusqlite_migration = "2.6.0"
uniffi = { version = "0.32.2", features = [
    "cli",
    "scaffolding-ffi-buffer-fns",
]}

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

# Android -> Logcat
[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.13"

# Apple platforms (iOS & macOS) -> System Console / os_log
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
oslog = "0.2.0"

# Non-Android platforms (macOS, iOS, Windows, Linux) -> Terminal logging fallback
[target.'cfg(not(target_os = "android"))'.dependencies]
env_logger = "0.11.11"

[target.'cfg(target_os = "ios")'.dependencies]
bzip2-sys = "0.1"

[lints.clippy]
pedantic = {level = "deny", priority = -1}
nursery = {level = "deny", priority = -1}
#DENY PANICS:
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithimetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"
